<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AD Argoncilhe | Administração</title>
<style>
:root{--bg:#080808;--panel:#151515;--line:#2d2d2d;--text:#fff;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px 50px}h1{margin:0 0 6px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:13px;color:#ccc;margin-bottom:7px}input,textarea,button{font:inherit}input,textarea{width:100%;background:#0e0e0e;color:#fff;border:1px solid #383838;border-radius:10px;padding:11px}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:10px;align-items:center}.btn{border:0;background:#fff;color:#000;padding:11px 16px;border-radius:10px;font-weight:800;cursor:pointer}.btn.alt{background:#242424;color:#fff;border:1px solid #444}.status{margin-left:auto;font-size:13px;color:#aaa}.hidden{display:none}.item{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.logout{cursor:pointer;color:#ddd;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body><main class="wrap">
<div id="loginPanel" class="panel">
  <h1>Administração</h1><p class="muted">Área reservada da AD Argoncilhe.</p>
  <div class="grid"><div><label>Email</label><input id="email" type="email" autocomplete="username"></div><div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="loginBtn">Entrar</button><span class="status" id="loginStatus"></span></div>
</div>
<div id="app" class="hidden">
  <div class="top"><div><h1>Painel da equipa</h1><div class="muted">Edita a informação e publica com um clique.</div></div><button class="btn alt" id="logoutBtn">Sair</button></div>
  <section class="panel"><h2>Próximo treino</h2><div class="grid"><div><label>Data</label><input id="ntDate"></div><div><label>Hora</label><input id="ntTime"></div><div class="full"><label>Local</label><input id="ntPlace"></div><div class="full"><label>Etiqueta</label><input id="ntTag"></div></div></section>
  <section class="panel"><h2>Aviso</h2><div class="grid"><div class="full"><label>Título</label><input id="noticeTitle"></div><div class="full"><label>Texto</label><textarea id="noticeText"></textarea></div></div></section>
  <section class="panel"><h2>Próximos treinos</h2><div id="trainings"></div><button class="btn alt" id="addTraining" style="margin-top:14px">+ Adicionar treino</button></section>
  <section class="panel"><h2>Jogos</h2><div id="games"></div><button class="btn alt" id="addGame" style="margin-top:14px">+ Adicionar jogo</button></section>
  <section class="panel"><h2>Calendário</h2><div id="calendar"></div><button class="btn alt" id="addCalendar" style="margin-top:14px">+ Adicionar linha</button></section>
  <div class="row"><button class="btn" id="saveBtn">Guardar alterações</button><span class="status" id="saveStatus"></span></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const {createClient}=supabase; const client=createClient(window.SUPABASE_URL,window.SUPABASE_KEY); let content=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function rowFields(container, type, data={}, idx){
 const div=document.createElement('div'); div.className='item';
 if(type==='training') div.innerHTML=`<div class="grid"><input data-k="day" placeholder="Dia" value="${esc(data.day)}"><input data-k="date" placeholder="Data" value="${esc(data.date)}"><input data-k="title" placeholder="Título" value="${esc(data.title)}"><input data-k="time" placeholder="Hora" value="${esc(data.time)}"><input data-k="place" class="full" placeholder="Local" value="${esc(data.place)}"></div><button class="btn alt remove" style="margin-top:10px">Remover</button>`;
 if(type==='game') div.innerHTML=`<div class="grid"><input data-k="date" placeholder="Data" value="${esc(data.date)}"><input data-k="day" placeholder="Dia" value="${esc(data.day)}"><input data-k="home" placeholder="Casa" value="${esc(data.home)}"><input data-k="away" placeholder="Fora" value="${esc(data.away)}"><input data-k="time" placeholder="Hora" value="${esc(data.time)}"><input data-k="place" placeholder="Local" value="${esc(data.place)}"><input data-k="type" class="full" placeholder="Tipo (AMIGÁVEL, CAMPEONATO...)" value="${esc(data.type)}"></div><button class="btn alt remove" style="margin-top:10px">Remover</button>`;
 if(type==='calendar') div.innerHTML=`<div class="grid"><input data-k="date" placeholder="Data" value="${esc(data.date)}"><input data-k="activity" placeholder="Atividade" value="${esc(data.activity)}"><input data-k="place" class="full" placeholder="Local" value="${esc(data.place)}"></div><button class="btn alt remove" style="margin-top:10px">Remover</button>`;
 div.querySelector('.remove').onclick=()=>div.remove(); container.appendChild(div);
}
function collect(container){return [...container.children].map(el=>Object.fromEntries([...el.querySelectorAll('[data-k]')].map(i=>[i.dataset.k,i.value.trim()])))}
function render(){ $('ntDate').value=content.nextTraining.date;$('ntTime').value=content.nextTraining.time;$('ntPlace').value=content.nextTraining.place;$('ntTag').value=content.nextTraining.tag;$('noticeTitle').value=content.notice.title;$('noticeText').value=content.notice.text; $('trainings').innerHTML=''; $('games').innerHTML=''; $('calendar').innerHTML=''; (content.trainings||[]).forEach((x,i)=>rowFields($('trainings'),'training',x,i)); (content.games||[]).forEach((x,i)=>rowFields($('games'),'game',x,i)); (content.calendar||[]).forEach((x,i)=>rowFields($('calendar'),'calendar',x,i)); }
async function load(){const {data,error}=await client.from('team_content').select('content').eq('id','main').maybeSingle(); if(error){$('saveStatus').textContent=error.message;return} content=data?.content||{nextTraining:{},notice:{},trainings:[],games:[],calendar:[]}; render();}
$('loginBtn').onclick=async()=>{ $('loginStatus').textContent='A entrar...'; const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}); $('loginStatus').textContent=error?error.message:''; if(!error){$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');await load();}};
$('logoutBtn').onclick=async()=>{await client.auth.signOut();location.reload()};
$('addTraining').onclick=()=>rowFields($('trainings'),'training',{day:'',date:'',title:'Treino',time:'18:00',place:'Centro Social de Argoncilhe'});
$('addGame').onclick=()=>rowFields($('games'),'game',{date:'',day:'',home:'AD Argoncilhe',away:'',time:'',place:'',type:'AMIGÁVEL'});
$('addCalendar').onclick=()=>rowFields($('calendar'),'calendar',{date:'',activity:'',place:''});
$('saveBtn').onclick=async()=>{ const {data:sessionData}=await client.auth.getSession(); if(!sessionData.session){alert('Sessão expirada. Entra novamente.');return;} content.nextTraining={date:$('ntDate').value.trim(),time:$('ntTime').value.trim(),place:$('ntPlace').value.trim(),tag:$('ntTag').value.trim()}; content.notice={title:$('noticeTitle').value.trim(),text:$('noticeText').value.trim()}; content.trainings=collect($('trainings'));content.games=collect($('games'));content.calendar=collect($('calendar')); $('saveStatus').textContent='A guardar...'; const {error}=await client.from('team_content').upsert({id:'main',content,updated_at:new Date().toISOString()}); $('saveStatus').textContent=error?error.message:'Guardado ✓'; };
client.auth.getSession().then(({data})=>{if(data.session){$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');load();}});
</script></body></html>
