name: Atualizar calendário de jogos
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/gerar-calendario.cjs'
      - '.github/workflows/calendario-jogos.yml'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar calendário público
        env:
          SUPABASE_URL: https://leheuqzeutgkwuqmqcjp.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_SU5jD6dT-_ze1r4AFTJN4g_rcWWNhdv
        run: node scripts/gerar-calendario.cjs
      - name: Publicar apenas se houver alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos.ics
          if ! git diff --cached --quiet; then
            git commit -m "chore(calendar): atualizar jogos públicos"
            git push
          fi
